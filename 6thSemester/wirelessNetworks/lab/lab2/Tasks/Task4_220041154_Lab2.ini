[Config ChannelBaseline]
network = WiredAndWirelessHostsWithAP
sim-time-limit = 200s

**.addDefaultRoutes = false

# --- Application setup ---
**.*Host*.numApps = 3

**.*Host*.app[0].typename = "UdpEchoApp"
**.*Host*.app[0].localPort = 1000

**.*Host*.app[*].typename = "UdpBasicApp"

# Wired hosts — traffic destinations
**.wiredHost1.app[1].destAddresses    = "wirelessHost1"
**.wiredHost1.app[2].destAddresses    = "wiredHost2"

**.wiredHost2.app[1].destAddresses    = "wirelessHost1"
**.wiredHost2.app[2].destAddresses    = "wiredHost1"

**.wiredHost3.app[1].destAddresses    = "wirelessHost1"
**.wiredHost3.app[2].destAddresses    = "wiredHost1"    

# Wireless hosts — traffic destinations
**.wirelessHost1.app[1].destAddresses = "wiredHost1"
**.wirelessHost1.app[2].destAddresses = "wiredHost2"

**.wirelessHost2.app[1].destAddresses = "wiredHost1"    
**.wirelessHost2.app[2].destAddresses = "wirelessHost1" 

# Common app parameters
**.*Host*.app[1..].destPort      = 1000
**.*Host*.app[1..].messageLength = 512B
**.*Host*.app[1..].sendInterval  = 0.5s
**.*Host*.app[1..].stopTime      = 180s

# --- Wireless PHY: transmission power and sensitivity ---
**.wlan[0].radio.transmitter.power        = 20mW      
**.wlan[0].radio.transmitter.bitrate      = 54Mbps     
**.wlan[0].radio.receiver.sensitivity     = -85dBm     
**.wlan[0].radio.receiver.energyDetection = -85dBm     
**.wlan[0].radio.carrierFrequency         = 2.4GHz

# --- Path loss model: free space baseline ---
**.radioMedium.pathLoss.typename = "FreeSpacePathLoss"

# --- Background noise: thermal noise floor ---
**.radioMedium.backgroundNoise.power = -110dBm

**.initialZ = 0m

[Config Power_High]
extends = ChannelBaseline               
**.wlan[0].radio.transmitter.power = 100mW  
[Config Power_Medium]
extends = ChannelBaseline
**.wlan[0].radio.transmitter.power = 5mW 

[Config Power_Low]
extends = ChannelBaseline
**.wlan[0].radio.transmitter.power = 0.5mW  

[Config Noise_VeryLow]
extends = ChannelBaseline
**.radioMedium.backgroundNoise.power = -120dBm  

[Config Noise_Baseline]
extends = ChannelBaseline
**.radioMedium.backgroundNoise.power = -110dBm 

[Config Noise_High]
extends = ChannelBaseline
**.radioMedium.backgroundNoise.power = -90dBm  

[Config Noise_Extreme]
extends = ChannelBaseline
**.radioMedium.backgroundNoise.power = -75dBm   


[Config PathLoss_FreeSpace]
extends = ChannelBaseline
**.radioMedium.pathLoss.typename = "FreeSpacePathLoss"

[Config Multipath_Study]
extends = ChannelBaseline
**.radioMedium.pathLoss.typename = "LogNormalShadowing"
**.radioMedium.pathLoss.alpha = 3.5 


[Config PathLoss_EdgeOfCoverage]
extends = ChannelBaseline
**.radioMedium.pathLoss.typename              = "LogNormalShadowing"
**.radioMedium.pathLoss.alpha                 = 3.5
**.wlan[0].radio.transmitter.power            = 5mW
**.wlan[0].radio.receiver.sensitivity         = -85dBm


[Config Interference_Control]
network = WiredAndWirelessHostsWithAP    
sim-time-limit = 200s
**.addDefaultRoutes = false


**.*Host*.numApps = 2
**.*Host*.app[0].typename = "UdpEchoApp"
**.*Host*.app[0].localPort = 1000
**.*Host*.app[*].typename = "UdpBasicApp"

**.[wiredHost1.app][1].destAddresses    = "wirelessHost1"
**.[wirelessHost1.app][1].destAddresses  = "wiredHost1"
**.[wiredHost2.app][1].destAddresses     = "wiredHost1"

**.*Host*.app[1].destPort      = 1000
**.*Host*.app[1].messageLength = 512B
**.*Host*.app[1].sendInterval  = 0.5s
**.*Host*.app[1].stopTime      = 180s


**.interferer.numApps = 0              
**.wlan[0].radio.transmitter.power       = 20mW
**.wlan[0].radio.transmitter.bitrate     = 54Mbps
**.wlan[0].radio.receiver.sensitivity    = -85dBm
**.wlan[0].radio.receiver.energyDetection = -85dBm
**.wlan[0].radio.carrierFrequency        = 2.4GHz
**.radioMedium.pathLoss.typename         = "FreeSpacePathLoss"
**.radioMedium.backgroundNoise.power     = -110dBm
**.initialZ = 0m


[Config Interference_Active]
extends = Interference_Control           
**.interferer.numApps = 1               
**.interferer.app[0].typename      = "UdpBasicApp"
**.interferer.app[0].destAddresses = "wiredHost2"  
**.interferer.app[0].destPort      = 1000
**.interferer.app[0].messageLength = 1400B      
**.interferer.app[0].sendInterval  = 0.05s        
**.interferer.app[0].startTime     = 20s          
**.interferer.app[0].stopTime      = 140s 
