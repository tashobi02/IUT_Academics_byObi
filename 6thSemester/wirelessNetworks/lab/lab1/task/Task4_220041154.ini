[General]
network = WiredAndWirelessHostsWithAP
sim-time-limit = 500s

**.addDefaultRoutes = false

**.*Host*.numApps = 4


**.vector-recording = false
**.wiredHost1.*.vector-recording = true
**.router.*.vector-recording = true


**.[wiredHost1.app][1].startTime   = 0s
**.[wiredHost1.app][2].startTime   = 5s
**.[wiredHost2.app][1].startTime   = 10s
**.[wiredHost2.app][2].startTime   = 15s
**.[wirelessHost1.app][1].startTime = 20s
**.[wirelessHost1.app][2].startTime = 25s

**.*Host*.app[1..].sendInterval = exponential(1s)

**.*Host*.app[0].typename = "UdpEchoApp"
**.*Host*.app[0].localPort = 1000

**.*Host*.app[*].typename = "UdpBasicApp"

**.wiredHost1.app[1].destAddresses    = "wirelessHost1"
**.wiredHost1.app[2].destAddresses    = "wiredHost2"
**.wiredHost2.app[1].destAddresses    = "wirelessHost1"
**.wiredHost2.app[2].destAddresses    = "wiredHost1"
**.wirelessHost1.app[1].destAddresses = "wiredHost1"
**.wirelessHost1.app[2].destAddresses = "wiredHost2"

**.wiredHost1.app[3].destAddresses    = "wiredHost3"
**.wiredHost2.app[3].destAddresses    = "wiredHost3"
**.wirelessHost1.app[3].destAddresses = "wiredHost3"

**.wiredHost3.app[1].destAddresses    = "wiredHost1"
**.wiredHost3.app[2].destAddresses    = "wirelessHost1"
**.wiredHost3.app[3].destAddresses    = "wiredHost2"

**.*Host*.app[1..2].destPort        = 1000
**.*Host*.app[1..2].messageLength   = 100B
**.*Host*.app[1..2].sendInterval    = 1s
**.*Host*.app[1..2].stopTime        = 300s

**.*Host*.app[3].destPort           = 1000
**.*Host*.app[3].messageLength      = 200B
**.*Host*.app[3].sendInterval       = 2s
**.*Host*.app[3].stopTime           = 300s

**.initialZ = 0m